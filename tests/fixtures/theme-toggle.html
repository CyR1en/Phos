<!-- ThemeToggle.astro: decorative SVG paths omitted; icon display is driven by root mode CSS. -->
<button id="theme-toggle" type="button" aria-label="Theme: auto. Switch to light">
  <svg id="sun-icon" class="size-4" aria-hidden="true" focusable="false"></svg>
  <svg id="moon-icon" class="size-4" aria-hidden="true" focusable="false"></svg>
  <svg id="auto-icon" class="size-4" aria-hidden="true" focusable="false"></svg>
</button>
<span id="theme-toggle-status" class="sr-only" role="status" aria-live="polite"></span>
